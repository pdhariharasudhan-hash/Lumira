name: Route parameter regression tests

concurrency:
  group: lumira-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "app/routes/**"
      - "app/services/**"
      - "app/services/image/**"
      - "tests/test_image_understanding.py"
      - "tests/test_voice_interactions.py"
      - "tests/test_route_parameter_defaults.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/route-parameter-regression.yml"
      - "lumira_desktop/**"
      - ".github/workflows/desktop-checks.yml"
  push:
    branches: [main]
    paths:
      - "app/routes/**"
      - "app/services/**"
      - "app/services/image/**"
      - "tests/test_image_understanding.py"
      - "lumira_desktop/**"
      - ".github/workflows/desktop-checks.yml"
      - "tests/test_voice_interactions.py"
      - "tests/test_route_parameter_defaults.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/route-parameter-regression.yml"

permissions:
  contents: read

jobs:
  route-parameter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify route defaults and validation metadata
        run: python -m pytest -q tests/test_route_parameter_defaults.py tests/test_artifact_relationships.py tests/test_voice_interactions.py tests/test_voice_memory_retry.py tests/test_image_understanding.py tests/test_search.py tests/test_provider_startup_registration.py tests/test_ollama_vision_provider.py tests/test_faster_whisper_transcription_provider.py

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lumira_desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lumira_desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build desktop interface
        run: npm run build
      - name: Run desktop tests
        run: npm test

  backend-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full backend regression suite
        run: python -m pytest -q
